<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promociones Urbanas Montellano · Control de promociones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!--CHARTJS-->
<style>
:root{
--navy:#102C57;--navy2:#0a1f40;--navy3:#1c4183;--ink:#16233d;--ink2:#54617a;--ink3:#8a94a8;
--line:#e3e7ef;--line2:#eef1f6;--bg:#f5f7fa;--card:#fff;
--ok:#1b7f4d;--warn:#b57407;--bad:#b3261e;--accent:#102C57;
--shadow:0 1px 2px rgba(16,44,87,.05),0 6px 20px rgba(16,44,87,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;
font-family:"Libre Franklin",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
/* ---------- cabecera corporativa ---------- */
header{background:var(--navy);color:#fff}
.hwrap{max-width:1880px;margin:0 auto;padding:0 30px}
.htop{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;padding:16px 0 14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.mark{width:40px;height:40px;flex:0 0 40px;border:1.6px solid #fff;display:flex;align-items:center;justify-content:center}
.mark i{display:block;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid #fff}
.wordmark{line-height:1}
.wordmark b{display:block;font-size:21px;font-weight:600;letter-spacing:-.3px}
.wordmark span{display:block;font-size:9.5px;letter-spacing:3.1px;text-transform:uppercase;color:#9db0d0;margin-top:3px}
.sep{width:1px;height:38px;background:rgba(255,255,255,.18);margin:0 4px}
.htitle{min-width:0}
.htitle b{display:block;font-size:14.5px;font-weight:600;letter-spacing:.1px}
.htitle span{display:block;font-size:11.5px;color:#93a6c6;margin-top:3px}
.htitle .act{display:block;color:#c9d6ea;font-weight:600;font-size:11px;margin-top:2px;letter-spacing:.2px}
.selwrap{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
select,input[type=search],input[type=text]{background:#fff;border:1px solid var(--line);border-radius:7px;
padding:8px 11px;font-size:13px;color:var(--ink);font-family:inherit;outline:none}
select:focus,input:focus{border-color:var(--navy3);box-shadow:0 0 0 3px rgba(28,65,131,.10)}
header select{font-weight:500;border-color:transparent}
#selPromo{min-width:288px}#selEj{min-width:186px}
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(255,255,255,.10)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;color:#96a8c7;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;
border-bottom:2px solid transparent;transition:.15s;letter-spacing:.1px}
.tab:hover{color:#dce5f2}
.tab.on{color:#fff;border-bottom-color:#fff}
/* ---------- banda de promoción ---------- */
.pband{background:#fff;border-bottom:1px solid var(--line)}
.pbin{max-width:1880px;margin:0 auto;padding:14px 30px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.plogo{width:44px;height:44px;flex:0 0 44px;border-radius:9px;display:flex;align-items:center;justify-content:center;
color:#fff;font-weight:600;font-size:15px;letter-spacing:.5px}
.plogo.img{background:#fff;border:1px solid var(--line);width:auto;min-width:44px;max-width:180px;padding:5px 10px;overflow:hidden}
.plogo.img img{height:32px;width:auto;max-width:158px;object-fit:contain;display:block}
.pmeta b{font-size:16px;font-weight:600;letter-spacing:-.2px}
.pmeta div{font-size:12px;color:var(--ink2);margin-top:2px}
.pstats{margin-left:auto;display:flex;gap:26px;flex-wrap:wrap}
.pstat{text-align:right}
.pstat .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink3);font-weight:600}
.pstat .v{font-size:15px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
main{max-width:1880px;margin:0 auto;padding:22px 30px 60px}
/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);
position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.85}
.kpi .l{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);font-weight:600}
.kpi .v{font-size:23px;font-weight:600;margin-top:6px;letter-spacing:-.6px;font-variant-numeric:tabular-nums;color:var(--navy)}
.kpi .v.pos{color:var(--ok)}.kpi .v.neg{color:var(--bad)}.kpi .v.wrn{color:var(--warn)}
.kpi .d{font-size:11px;color:var(--ink2);margin-top:4px;line-height:1.45}
/* ---------- tarjetas ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:16px}
.card>h3{margin:0;padding:14px 18px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);
display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:.1px;color:var(--navy)}
.card>h3 .note{font-weight:400;color:var(--ink3);font-size:11px;letter-spacing:0}
.cbody{padding:15px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:1.7fr 1fr;gap:18px}
.grid1{display:grid;grid-template-columns:1fr;gap:16px}
@media(max-width:1340px){.grid2,.grid3{grid-template-columns:1fr}}
/* ---------- tablas ---------- */
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{text-align:right;padding:9px 11px;font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;
color:var(--ink3);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;background:#fbfcfe}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
td{padding:8px 11px;text-align:right;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:600;border-top:1.5px solid var(--navy);background:#fbfcfe;color:var(--navy)}
tr.sub2 td{background:#f7f9fc;font-weight:600;color:var(--navy);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px}
tbody tr:hover{background:#f8fafd}
a.pdf{color:var(--navy3);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:4px}
a.pdf:hover{text-decoration:underline}
a.pdf svg{opacity:.55;flex:0 0 auto}
tr.clk{cursor:pointer}
tr.clk .lupa{opacity:0;color:var(--navy3);font-weight:600;transition:.12s}
tr.clk:hover .lupa{opacity:1}
tr.clk.sel{background:#eef3fb;box-shadow:inset 3px 0 0 var(--navy)}
tr.clk.sel .lupa{opacity:1}
.pos{color:var(--ok)}.neg{color:var(--bad)}.wrn{color:var(--warn)}.muted{color:var(--ink3)}
.chip{display:inline-block;padding:2.5px 8px;border-radius:4px;font-size:10.5px;font-weight:600;background:#eef2f8;color:var(--ink2);letter-spacing:.2px}
.chip.ok{background:#e6f4ec;color:#12653c}.chip.bad{background:#fbeae9;color:#96201a}
.chip.warn{background:#fdf3e3;color:#8a5806}.chip.info{background:#e9effa;color:#123a7a}
.bar{height:6px;border-radius:99px;background:#edf0f6;overflow:hidden;min-width:56px}
.bar i{display:block;height:100%;border-radius:99px}
.chartbox{position:relative;height:310px}.chartbox.sm{height:230px}
details{border-top:1px solid var(--line2)}
details>summary{cursor:pointer;padding:10px 18px;font-size:12.8px;font-weight:600;list-style:none;display:flex;
justify-content:space-between;align-items:center;gap:10px;color:var(--navy)}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"›";color:var(--ink3);margin-right:8px;transition:.15s;display:inline-block;font-size:15px}
details[open]>summary:before{transform:rotate(90deg)}
details>summary:hover{background:#f8fafd}
.dbody{padding:0 18px 14px;max-height:520px;overflow:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.toolbar input[type=search]{min-width:232px}
.scroll{overflow:auto;max-height:560px;position:relative}
.scroll thead th{position:sticky;top:0;z-index:3;box-shadow:inset 0 -1px 0 var(--line)}
.dbody thead th{position:sticky;top:0;z-index:3;background:#fbfcfe;box-shadow:inset 0 -1px 0 var(--line)}
.scroll table{min-width:820px}
.small{font-size:11.5px}
.pill{font-size:10.5px;padding:1.5px 6px;border-radius:4px;background:#eef2f8;color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.alert{border-left:3px solid var(--warn);background:#fffcf5;padding:12px 15px;border-radius:0 8px 8px 0;
font-size:12.5px;color:#6b4d13;margin-bottom:13px;line-height:1.6}
.alert.bad{border-color:var(--bad);background:#fff7f6;color:#8a2b26}
.alert.ok{border-color:var(--ok);background:#f4fbf7;color:#0e5c38}
.legend{font-size:11.2px;color:var(--ink3);line-height:1.65;margin-top:9px}
.hide{display:none!important}
.secdiv{display:flex;align-items:center;gap:14px;margin:30px 4px 16px;color:var(--navy);
font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:1.3px}
.secdiv:before,.secdiv:after{content:"";height:1px;background:var(--line);flex:1}
.secdiv span{white-space:nowrap}
/* ---- reparto de coste: selector de obra por apunte y panel de diferencias ---- */
select.osel{font:inherit;font-size:11.5px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;
background:#fff;color:var(--ink2);max-width:190px;cursor:pointer}
select.osel:hover{border-color:var(--navy3)}
select.osel.mod{border-color:var(--navy);background:#eef3fb;color:var(--navy);font-weight:600}
tr.mod td{background:#f4f8ff}
tr.mod td:first-child{box-shadow:inset 3px 0 0 var(--navy)}
td.expand{padding:0!important;background:#f7f9fc;box-shadow:inset 3px 0 0 var(--navy)}
.expwrap{padding:16px 18px 6px}
.expwrap table{min-width:0}
.expwrap .scroll{max-height:430px}
.pback{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:13px}
.pback>div{background:#fff;border:1px solid var(--line2);border-radius:8px;padding:9px 14px;min-width:150px}
.pback .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);font-weight:600}
.pback .v{font-size:15px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;margin-top:3px}
.pback .d{font-size:10.8px;color:var(--ink3);margin-top:2px}
td.expand2{padding:0!important;background:#fff;box-shadow:inset 3px 0 0 var(--navy3)}
.expwrap2{padding:12px 14px 4px}
.expwrap2 .scroll{max-height:330px}
/* la celda desplegada no debe ensanchar la tabla que la contiene: se limita a cero y
   el contenido de dentro se desplaza en horizontal si hiciera falta */
td.expand,td.expand2{max-width:0}
.expwrap,.expwrap2{overflow-x:auto}
.expwrap2 table td:nth-child(3),.expwrap table td:nth-child(3){white-space:normal;min-width:260px;max-width:430px}
.expwrap2 table td:nth-child(4),.expwrap table td:nth-child(4){white-space:normal;max-width:230px}
tr.ok td{color:var(--ink3)}
tr.ok td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
button.tick{padding:3px 10px;font-size:11px;font-weight:600;white-space:nowrap}
button.tick.on{background:#e6f4ec;border-color:#9ccbb2;color:#12653c}
.rtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:13px}
.rtab{padding:7px 13px;font-size:12.2px;font-weight:600;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.rtab:hover{color:var(--navy)}
.rtab.on{color:var(--navy);border-bottom-color:var(--navy)}
.rtab .n{font-weight:500;color:var(--ink3);margin-left:5px;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-size:11.8px;font-weight:600;padding:6px 13px;border-radius:6px;border:1px solid var(--line);
background:#fff;color:var(--navy);cursor:pointer}
.btn:hover{border-color:var(--navy3);background:#f6f9ff}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:#183d73}
.btn:disabled{opacity:.45;cursor:default}
.rowflex{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.wfull{width:100%}
footer{max-width:1880px;margin:0 auto;padding:0 30px 44px;color:var(--ink3);font-size:11px;line-height:1.75}
</style>
</head>
<body>
<header>
 <div class="hwrap">
  <div class="htop">
   <div class="brand">
    <div class="mark"><i></i></div>
    <div class="wordmark"><b>Montellano</b><span>Promociones Urbanas</span></div>
    <div class="sep"></div>
    <div class="htitle"><b>Control de promociones</b><span id="subtitle"></span></div>
   </div>
   <div class="selwrap">
    <select id="selEj"></select>
    <select id="selPromo"></select>
   </div>
  </div>
  <div class="tabs" id="tabs"></div>
 </div>
</header>
<div class="pband" id="pband"></div>
<main id="main"></main>
<footer id="footer"></footer>
<!--APP-->
</body>
</html>
